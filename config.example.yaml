# Static infra config for the finder. Copy to config.yaml (gitignored) and
# fill in. Everything else (location, radius, cadence, queries) is configured
# by talking to the bot on Signal.
#
# The finder is an API client of sigbot (which owns the Signal account):
# 1. add the bot account to your furniture-finder group,
# 2. in the sigbot dashboard, register that group as a service with
#    respond_to: "never (API-driven)" and the [label] prefix disabled,
# 3. mint an API key for it and paste it here.
sigbot:
  api_url: http://localhost:8100
  api_key: "sb___MINTED_IN_SIGBOT_DASHBOARD__"   # or set api_key_env
  # Your account: ACI uuid (reliable), or E.164 number if your account shares
  # its number. Find it in the sigbot dashboard's message log after messaging
  # the group once (the 'sender' field).
  user_id: "__YOUR_ACI_UUID_OR_NUMBER__"
db_path: data/bot.db
anthropic_api_key_env: ANTHROPIC_API_KEY
agent_model: claude-sonnet-4-6    # conversational bot (low volume)
judge_model: claude-haiku-4-5     # per-listing aesthetic verdict (high volume — keep cheap)
sources:
  craigslist: { enabled: true, site: sfbay }
  # Facebook Marketplace (M4): needs a one-time interactive login
  # (scripts/fb_login.py) into profile_dir, and the nix playwright browsers
  # (nix build .#playwright-browsers -o .playwright-browsers). Best effort —
  # a login wall trips a 24h circuit breaker and pings the group.
  facebook: { enabled: false, profile_dir: .fb-profile/ }
dashboard: { enabled: true, host: 0.0.0.0, port: 8099 }  # 0.0.0.0: published ports reach the container eth0, not its loopback
