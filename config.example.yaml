# Static infra config. Copy to config.yaml (gitignored) and fill in.
# Everything else (location, radius, cadence, queries) is configured by
# talking to the bot on Signal.
signal:
  api_url: http://localhost:8080
  bot_number: "+1__BOT_GV_NUMBER__"
  # Your account: E.164 number, or ACI uuid if your account doesn't share
  # its number (find it by messaging the bot once and reading the envelope).
  user_id: "+1__YOUR_NUMBER_OR_ACI_UUID__"
db_path: data/bot.db
anthropic_api_key_env: ANTHROPIC_API_KEY
agent_model: claude-sonnet-4-6    # conversational bot (low volume)
judge_model: claude-haiku-4-5     # per-listing aesthetic verdict (high volume — keep cheap)
sources:
  craigslist: { enabled: true, site: sfbay }
  # Facebook Marketplace (M4): needs a one-time interactive login
  # (scripts/fb_login.py) into profile_dir, and the nix playwright browsers
  # (nix build .#playwright-browsers -o .playwright-browsers). Best effort —
  # a login wall trips a 24h circuit breaker and pings the group.
  facebook: { enabled: false, profile_dir: .fb-profile/ }
dashboard: { enabled: true, host: 0.0.0.0, port: 8090 }  # 0.0.0.0: published ports reach the container eth0, not its loopback
