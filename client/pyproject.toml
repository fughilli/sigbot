[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigbot-client"
version = "0.2.5"
description = "Client for the sigbot per-group-chat service API (stdlib-only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/fughilli/sigbot"
Source = "https://github.com/fughilli/sigbot"

[tool.setuptools.packages.find]
include = ["sigbot_client*"]
